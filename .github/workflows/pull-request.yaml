name: Pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format check (spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.WORKING_JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6   # also validates the wrapper jar
        with:
          cache-provider: basic
      - name: Check formatting
        run: ./gradlew spotlessCheck

  test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(vars.SUPPORTED_JAVA_VERSIONS) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6   # also validates the wrapper jar
      - name: Build and test
        # spotless runs in its own job; keep it out of `check` here
        run: ./gradlew build -x spotlessCheck
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: build/reports/tests/
      - name: Upload jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar
          retention-days: 3

  containerize:
    name: Container build (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/libs
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            DOCKER_BASE_JAVA_VERSION_TAG=${{ vars.DOCKER_BASE_JAVA_VERSION_TAG }}
          push: false
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
