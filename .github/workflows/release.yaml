name: Publish package to GitHub Packages
on:
  release:
    types: 
      - created
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.WORKING_JAVA_VERSION }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6   # also validates the wrapper jar
        with:
          cache-provider: basic
      - name: Publish package
        # the release's git tag is the version; build.gradle strips a leading "v"
        run: ./gradlew publish -PreleaseVersion="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}   # via env, not inlined, so the tag can't inject shell
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            build/libs/*.jar
  containerize:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: build/libs
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # placeholders are filled from the release's git tag; :latest is added for non-prereleases
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            DOCKER_BASE_JAVA_VERSION_TAG=${{ vars.DOCKER_BASE_JAVA_VERSION_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
