name: Documentation / Examples
description: Report missing, unclear, or outdated docs, Javadoc, or examples
labels: ["documentation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - label: README.md
        - label: Javadoc / API comments
        - label: Examples (examples/)
        - label: MIGRATION.md
        - label: CONFORMANCE.md
        - label: Other
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is missing, unclear, or incorrect?
      description: Include links or file paths if applicable.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
